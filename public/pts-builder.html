.obtn.on{border-color:transparent;box-shadow:0 0 0 2px var(--ink) inset;font-weight:700}
.obtn.on.ob-o{background:color-mix(in srgb,var(--dps) 16%,var(--panel));box-shadow:0 0 0 2px var(--dps) inset}
.obtn.on.ob-d{background:color-mix(in srgb,var(--tank) 16%,var(--panel));box-shadow:0 0 0 2px var(--tank) inset}
.obtn.on.ob-n{background:color-mix(in srgb,var(--muted) 16%,var(--panel));box-shadow:0 0 0 2px var(--muted) inset}
.obtn.on.ob-e{background:color-mix(in srgb,var(--sup) 14%,var(--panel));box-shadow:0 0 0 2px var(--sup) inset}
.obtn.on .obd{color:inherit}

.o-auto{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:10px 12px;border:1px dashed var(--line);border-radius:6px}
.oc-why{margin:0;font-size:12.5px;line-height:1.4;color:var(--ink);background:color-mix(in srgb,var(--gold) 12%,transparent);border-radius:4px;padding:5px 8px}

.tstats .ts-h{font:500 10.5px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.tstats .ts-row{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;font-size:13.5px;margin:3px 0}
.tstats .ts-row b{text-align:right;font-variant-numeric:tabular-nums}
.tstats .sf-t{height:8px}

#ch23 .qc select{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
#ch23 .qc-h{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin-top:8px}
#ch23 h2 .n{margin-right:10px}
#rbwv,#rbrefv{font:700 14px/1 var(--mono);color:var(--blood)}

.tsheet{border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:10px 14px}
.tsheet .ts-head{margin:0 0 6px;font-weight:600;font-variant-numeric:tabular-nums}
.tsheet h4{margin:10px 0 4px;font:500 11px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tsheet table{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}.tsheet td:nth-child(1){width:34%}.tsheet td:nth-child(2){width:20%}.tsheet td:nth-child(3){width:28%}
#rtexp .qx-h{gap:4px 12px}#rtexp .qx-row button,#rtexp .btnl{min-height:36px}.tsheet td{padding:4px 8px 4px 0;border-bottom:1px solid var(--line);vertical-align:top}
.btnl{display:inline-flex;align-items:center;font:600 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:9px 12px;border:1px solid var(--ink);border-radius:4px;color:var(--ink);text-decoration:none}
@media(max-width:520px){.tsheet td:nth-child(4){display:none}}

.discbtn{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:8px 11px;border-radius:4px;background:#5865F2;color:#fff;text-decoration:none}
.discbtn:hover{filter:brightness(1.1)}
.discbox{border-left:4px solid #5865F2}
.discbox textarea{width:100%;font:12.5px/1.45 var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);resize:vertical}

.parts{max-width:1180px;margin:-16px auto 28px;display:flex;gap:8px;flex-wrap:wrap}
.parts a{flex:1 1 200px;display:flex;flex-direction:column;gap:2px;padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);text-decoration:none}
.parts a b{font:700 15px/1.2 var(--display)}
.parts a span{font:500 11px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.parts a[aria-current="page"]{border-color:var(--blood);box-shadow:inset 0 -3px 0 var(--blood)}
.parts a:hover,.parts a:focus-visible{border-color:var(--gold);outline:none}
.p1 .tgt{display:none}
@media (max-width:820px){.wrap.solo{display:block}}
.wrap.solo{grid-template-columns:minmax(0,1fr)}
/* Collection complète */
.cc-ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 14px}
.cc-ctrl input{flex:1 1 220px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);font:inherit}
.cc-ctrl select{padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);font:inherit}
.cc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cc{position:relative;display:flex;flex-direction:column;border-radius:8px;overflow:hidden;background:var(--panel);border:2px solid var(--rc,var(--line));content-visibility:auto;contain-intrinsic-size:150px 250px}
.cc[data-r="Bronze"]{--rc:#A0673A}.cc[data-r="Argent"]{--rc:#9AA3AE}.cc[data-r="Or"]{--rc:#C99A2E}.cc[data-r="Cristal"]{--rc:#9B7BD8}
.cc .pic{position:relative;aspect-ratio:1/1;background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 35%,transparent),transparent 70%)}
.cc .pic img{width:100%;height:100%;object-fit:cover;display:block}
.cc .pic .ph{position:absolute;inset:0;display:grid;place-items:center;font:800 40px/1 var(--display);color:var(--rc)}
.cc .ov{position:absolute;left:6px;top:6px;font:800 20px/1 var(--display);background:var(--rc);color:#fff;padding:4px 7px;border-radius:4px;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.cc .rl{position:absolute;right:6px;top:6px;background:var(--panel)}
.cc .bd{padding:8px 9px 10px;display:flex;flex-direction:column;gap:5px}
.cc .nm{font:700 15px/1.15 var(--display);overflow-wrap:anywhere}
.cc .ws{display:flex;gap:4px;flex-wrap:wrap}
.cc .ws span{font:500 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em;padding:3px 5px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.cc .ws span.m{color:var(--ink);border-color:currentColor}
.cc .sts{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;font:500 11px/1.2 var(--mono);text-align:center}
.cc .sts i{font-style:normal;display:block;color:var(--muted);font-size:9px}
.cc .vr{font:500 10px/1.2 var(--mono);color:var(--gold);text-transform:uppercase;letter-spacing:.05em}
