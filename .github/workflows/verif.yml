# Vérifie le code sur chaque pull request (et sur main) : formatage, lint, règles maison, rendu.
# Une PR dont cette vérif est rouge ne peut pas être fusionnée (règle de protection de main).
name: Vérification du code

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verif:
    name: verif
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci --include=dev
        env:
          SKIP_SIMPLE_GIT_HOOKS: '1'

      - name: Installer Chromium (captures)
        run: npx playwright install --with-deps chromium

      - name: Vérification complète
        run: npm run verif

      - name: Garder les captures en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: shots/
          if-no-files-found: ignore
