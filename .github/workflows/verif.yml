# Vérifie le code sur chaque pull request (et sur main) : formatage, lint, règles maison, rendu.
# Une PR dont cette vérif est rouge ne peut pas être fusionnée (règle de protection de main).
name: Vérification du code

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Droits minimum : lecture seule du dépôt
permissions:
  contents: read

concurrency:
  group: verif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verif:
    name: verif
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Vrai Postgres pour tester les règles RLS (tools/test-rls.mjs)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci --include=dev
        env:
          SKIP_SIMPLE_GIT_HOOKS: '1'

      - name: Installer Chromium (captures)
        run: npx playwright install --with-deps chromium

      - name: Vérification complète
        run: npm run verif

      - name: Garder les captures en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: shots/
          if-no-files-found: ignore
