# Mise en ligne du site sur GitHub Pages (undocpourtous.com) à chaque fusion dans main.
# Le site est construit ici (Tailwind + Astro + CSP) : aucun fichier généré n'est suivi par git.
# Réglage GitHub nécessaire : Settings › Pages › Source = « GitHub Actions ».
name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Une seule mise en ligne à la fois ; on ne coupe pas celle qui est en cours
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    name: construire
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci --include=dev
        env:
          SKIP_SIMPLE_GIT_HOOKS: '1'

      - name: Construire le site (dist/)
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # .well-known/security.txt est un dossier caché : à inclure explicitement
          include-hidden-files: true

  publier:
    name: publier
    needs: construire
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
