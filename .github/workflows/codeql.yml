# Analyse de sécurité du code JavaScript/TypeScript (GitHub CodeQL), à chaque PR et chaque semaine
name: Analyse CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths-ignore:
              - public/assets/vendor
              - public/assets/css
              - public/pts-encyclopedie.html
              - public/pts-builder.html
              - dist
      - uses: github/codeql-action/analyze@v4
